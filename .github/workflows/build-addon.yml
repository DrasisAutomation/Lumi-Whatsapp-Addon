name: Build & Test WhatsApp Add-on

on:
  push:
    branches:
      - main
    paths:
      - "repository.yaml"
      - "whatsapp_addon/**"
      - ".github/workflows/build-addon.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-addon:
    name: Validate & Run Node.js Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: whatsapp_addon/package-lock.json

      - name: Install dependencies reproducibly
        working-directory: whatsapp_addon
        run: npm ci

      - name: Run Node.js automated test suite
        working-directory: whatsapp_addon
        run: npm test

      - name: Validate version consistency
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("whatsapp_addon/package.json", "utf8"));
            const manifest = JSON.parse(fs.readFileSync("custom_components/whatsapp/manifest.json", "utf8"));
            const configYaml = fs.readFileSync("whatsapp_addon/config.yaml", "utf8");
            const match = configYaml.match(/^version:\s*["\x27]?([0-9]+\.[0-9]+\.[0-9]+)["\x27]?/m);
            if (!match) throw new Error("Missing version in whatsapp_addon/config.yaml");
            const cfgVer = match[1];
            if (pkg.version !== cfgVer || manifest.version !== cfgVer) {
              throw new Error(`Version mismatch: config.yaml=${cfgVer}, package.json=${pkg.version}, manifest.json=${manifest.version}`);
            }
            console.log("Version consistency verified:", cfgVer);
          '

  build-docker:
    name: Build Multi-Arch Add-on Images (${{ matrix.arch }})
    needs: test-addon
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            base_image: ghcr.io/home-assistant/amd64-base:3.20
          - arch: aarch64
            platform: linux/arm64
            base_image: ghcr.io/home-assistant/aarch64-base:3.20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from config.yaml
        id: meta
        run: |
          VERSION=$(grep -E '^version:' whatsapp_addon/config.yaml | sed -E 's/version:\s*["'\'']?([^"'\'']+)["'\'']?/\1/')
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER_LC}/ha-whatsapp-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: ./whatsapp_addon
          file: ./whatsapp_addon/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ matrix.base_image }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
