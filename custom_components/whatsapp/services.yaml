  fields:
    clientId:
      name: Account ID (clientId)
      description: Identifier of the WhatsApp account.
      required: false
      default: "default"
      example: "default"
      selector:
        text:

check_number:
  name: Check WhatsApp Number Registration
  description: Check whether a phone number is registered on WhatsApp and return its canonical JID.
  fields:
    clientId:
      name: Account ID (clientId)
      description: Identifier of the WhatsApp account to query from.
      required: false
      default: "default"
      example: "default"
      selector:
        text:
    number:
      name: Phone Number
      description: Phone number in international format (e.g. 919876543210).
      required: true
      example: "919876543210"
      selector:
        text:

disconnect:
  name: Disconnect WhatsApp Account
  description: Gracefully disconnect a WhatsApp account socket without deleting its stored session credentials.
  fields:
    clientId:
      name: Account ID (clientId)
      description: Identifier of the WhatsApp account to disconnect.
      required: false
      default: "default"
      example: "default"
      selector:
        text:

reconnect:
  name: Reconnect WhatsApp Account
  description: Reconnect a WhatsApp account session.
  fields:
    clientId:
      name: Account ID (clientId)
      description: Identifier of the WhatsApp account to reconnect.
      required: false
      default: "default"
      example: "default"
      selector:
        text:

send_message_to_group:
  name: Send WhatsApp Message to Group
  description: Send a text message to a WhatsApp Group JID.
  fields:
    clientId:
      name: Account ID (clientId)
      description: Identifier of the WhatsApp account to send from.
      required: false
      default: "default"
      example: "default"
      selector:
        text:
    groupId:
      name: Group JID
      description: Target WhatsApp group JID (e.g. 1203630123456789@g.us).
      required: true
      example: "1203630123456789@g.us"
      selector:
        text:
    body:
      name: Message Body
      description: Object containing the message text (e.g. {"text": "House alarm armed"}) or plain string.
      required: true
      example: '{"text": "House alarm armed"}'
      selector:
        object:
